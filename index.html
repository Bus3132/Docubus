<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocuBus</title>
<meta name="description" content="Documents vierges et délivrance exceptionnelle de TSO au Bus 31/32 (accès réservé à l'équipe).">
<meta name="theme-color" content="#0d2a5e">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DocuBus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/commun.css">
<style>
/* ---------- Connexion ---------- */
.auth{max-width:440px;margin:18px auto 0}
.auth .card{gap:14px}
.auth p{margin:0;font-size:15px;color:var(--muted)}

/* ---------- Documents (organisation : recherche, filtres, récents, catégories) ---------- */
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink)}
.search input{padding-left:42px;height:52px;border-width:3px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:8px 13px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--orange);box-shadow:3px 3px 0 #fff}
.dlist{background:#fff;color:var(--ink);border:var(--bd);box-shadow:var(--shadow)}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px dashed var(--ink)}
.doc:last-child{border-bottom:0}
.doc .ico{width:34px;height:42px;flex:0 0 auto;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-size:10px;font-weight:700;color:#fff;background:var(--grey)}
.doc .ico.pdf{background:#c2410c}.doc .ico.doc{background:var(--blue)}.doc .ico.xls{background:#178a47}.doc .ico.img{background:var(--orange);color:var(--ink)}
.doc .t{flex:1;min-width:0}
.doc .t a{display:block;font-weight:700;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.doc .t small{color:var(--muted);font-size:12px}
.doc .act{display:flex;gap:6px;flex:0 0 auto}
.iconbtn{width:44px;height:44px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;color:var(--ink);text-decoration:none;padding:0}
.iconbtn svg{width:20px;height:20px}
.doc.gen{background:var(--warn-bg)}
.doc.gen .ico{background:var(--orange);color:var(--ink)}
.empty{padding:12px 14px;color:var(--muted);font-size:14px}
.catlist{display:grid;gap:12px}
.catrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;color:var(--ink);border:var(--bd);padding:13px 14px;text-align:left}
.catrow:nth-child(4n+1){transform:rotate(.6deg)}.catrow:nth-child(4n+2){transform:rotate(-.7deg)}.catrow:nth-child(4n+3){transform:rotate(.35deg)}.catrow:nth-child(4n){transform:rotate(-.45deg)}
.catrow .name{flex:1;font-family:var(--f-brand);font-size:20px;line-height:1.15}
.catrow .count{background:var(--ink);color:#fff;font-family:var(--f-num);font-weight:700;font-size:14px;padding:2px 9px}
.catrow svg{width:20px;height:20px;flex:0 0 auto}
.dark .ghost,.backlink{color:#fff}
.backlink{border:0;background:transparent;font-weight:700;font-size:15px;padding:4px 0;display:inline-flex;align-items:center;gap:6px;justify-self:start}
.backlink svg{width:18px;height:18px}

/* ---------- Délivrance ---------- */
.dates{display:grid;gap:10px}
.daterow{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;align-items:end}
.daterow .wd{font-size:12px;color:var(--muted);min-height:16px;text-transform:none;letter-spacing:0;font-weight:400}
.daterow .lettres{grid-column:1/-1;margin-top:-2px;font-size:13px;color:var(--ink);font-style:italic;min-height:0}
.daterow .lettres:empty{display:none}
.dose{position:relative}
.dose input{padding-right:36px}
.dose em{position:absolute;right:10px;bottom:14px;font-style:normal;font-size:14px;color:var(--muted);pointer-events:none}
.patient h3 .n{display:inline-block;transform:rotate(-2deg)}
.errors{margin:0;padding:10px 12px 10px 30px;background:var(--warn-bg);color:var(--warn);border:3px solid var(--warn);font-size:14px;display:grid;gap:3px}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;color:var(--on-dark-ok)}
.privacy svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.stickyfoot{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:8px}
.addr{font-family:var(--f-num);font-size:14px;background:var(--field);border:2px solid var(--ink);padding:8px 10px;overflow-wrap:anywhere;color:var(--ink)}
.dest-chips{display:flex;gap:8px;flex-wrap:wrap}
.dest-chips .chip[aria-pressed="true"]{box-shadow:3px 3px 0 var(--ink)}
.dest-chips .chip.other{border-style:dashed}
.dest-chips.bad .chip{border-color:var(--warn);background:var(--warn-bg)}

/* ---------- Fenêtre d'envoi ---------- */
.dialog.send{max-width:480px}
.step{display:grid;gap:10px;border:2.5px solid var(--ink);padding:12px}
.step .sh{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.step .num{width:28px;height:28px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.step.done .num{background:var(--ok)}
.files{display:grid;gap:6px}
.files a{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:8px 10px;background:#fff}
.files a svg{width:18px;height:18px;color:#c2410c;flex:0 0 auto}
.files a span{flex:1;min-width:0;overflow-wrap:anywhere}
.files a small{color:var(--blue);font-weight:700}

/* ---------- Admin ---------- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{border:2.5px solid var(--ink);background:#fff;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.subtabs button[aria-pressed="true"]{background:var(--orange);box-shadow:3px 3px 0 #fff}
.drop{border:3px dashed var(--ink);background:var(--field);padding:20px 14px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--ink);cursor:pointer}
.drop.over{background:var(--warn-bg);border-color:var(--orange)}
.drop svg{width:34px;height:34px;color:var(--ink)}
.pending{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:1fr 180px 44px;gap:8px;align-items:start}
@media (max-width:560px){ .prow{grid-template-columns:1fr 44px} .prow select{grid-column:1} }
.prow small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:3px}
.cathead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cathead h3{flex:1;min-width:150px}
.arow{display:grid;gap:6px;padding:10px 0;border-top:2px dashed var(--ink)}
.arow .t{font-weight:700;overflow-wrap:anywhere}
.arow .t a{color:var(--ink)}
.arow .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:2px solid var(--ink);background:#fff;padding:6px 9px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px;font-family:inherit;border-radius:0}
.mini.red{color:var(--danger)}
.mini svg{width:15px;height:15px}
select.mini{padding-right:6px}
.log{font-family:var(--f-num);font-size:13px;background:var(--field);border:2px solid var(--ink);padding:10px;display:grid;gap:3px;max-height:200px;overflow:auto}
.log .ok{color:var(--ok)} .log .ko{color:var(--danger)}
.who{font-size:12px;color:var(--on-dark-muted)}
.card .who{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="logo"><img src="img/logo-app.png" alt="Logo Docubus : le bus chargé de documents" width="52" height="52"></span>
    <h1 class="wordmark">Docu<span class="bus">bus</span></h1>
    <button class="pillbtn" id="install" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Installer
    </button>
    <button class="avatar" id="account" hidden aria-label="Mon compte"></button>
  </div>

  <!-- Connexion : même principe et mêmes comptes que l'annuaire Annubus -->
  <section class="auth" id="auth" hidden>
    <div class="card">
      <h3>Accès réservé à l'équipe</h3>
      <p>Entrez votre adresse e-mail professionnelle : vous recevrez un e-mail de connexion. Ce sont les mêmes accès que pour l'annuaire Annubus.</p>
      <form id="authForm" class="field" style="gap:10px">
        <input class="in" id="authEmail" type="email" required autocomplete="email" inputmode="email" placeholder="votre.adresse@exemple.fr" aria-label="Adresse e-mail">
        <button class="primary" type="submit" id="authSend">Recevoir le lien</button>
      </form>
      <form id="codeForm" class="field" style="gap:10px" hidden>
        <input class="in num" id="authCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code reçu par e-mail" aria-label="Code reçu par e-mail">
        <button class="primary" type="submit">Valider le code</button>
        <button class="ghost" type="button" id="authBack">Changer d'adresse</button>
      </form>
      <div class="notice" id="authMsg" hidden></div>
    </div>
  </section>

  <div id="appwrap" hidden>
    <main>
      <section class="panel" id="p-docs"></section>
      <section class="panel" id="p-deliv" hidden></section>
      <section class="panel" id="p-admin" hidden></section>
    </main>
  </div>

  <footer>
    <div class="brush" aria-hidden="true"></div>
    <span>Docubus · Bus 31/32 · Marseille</span>
    <span class="who" id="who" hidden></span>
    <div class="links">
      <button id="howto-link">Installer l'appli sur son téléphone</button>
      <button id="logout" hidden>Se déconnecter</button>
    </div>
  </footer>
</div>

<nav class="bottom" id="nav" role="tablist" aria-label="Navigation principale" hidden>
  <button role="tab" data-tab="docs" aria-selected="true"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Documents</button>
  <button role="tab" data-tab="deliv" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v4l-4 8a4 4 0 0 0 3.6 6h4.8a4 4 0 0 0 3.6-6l-4-8V3"/><path d="M7.5 14h9"/></svg></span>Délivrance</button>
  <button role="tab" data-tab="admin" aria-selected="false" hidden><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>Admin</button>
</nav>

<div class="overlay" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="vendor/supabase-js-2.45.4/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
/* ======================================================================
   DocuBus — appli de l'équipe.
   ACCÈS : connexion par e-mail (lien ou code), mêmes comptes que l'annuaire
   Annubus (table « membres » de la base Supabase). Les documents, les
   destinataires et les textes sont dans la base, lisibles par les seuls
   membres ; seuls les administrateurs peuvent les modifier.
   CONFIDENTIALITÉ : le formulaire de délivrance vit uniquement en mémoire.
   Rien n'est envoyé à la base ni écrit dans le téléphone. Fermer ou
   recharger la page efface tout.
   ====================================================================== */
const CFG=window.DOCUBUS_CONFIG||{};
const DESKTOP=!/iphone|ipad|ipod|android/i.test(navigator.userAgent||'')&&!(navigator.maxTouchPoints>1&&/macintosh/i.test(navigator.userAgent||''))&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const DEFAULT_ENVOI=['medical@bus3132.org','social@bus3132.org'];
const BUCKET='docubus', GEN_CAT='delivrance-exceptionnelle', MAX_MB=25, SIGN_TTL=3600;
const DEFAULT_STRUCT={nom:'Bus 31/32',signataire:'Équipe médicale Bus3132',ville:'Marseille',
  entete:['Association loi 1901','129, avenue de Toulon','13005 MARSEILLE'],
  pied:['Association loi 1901','129 avenue de Toulon – 13005 MARSEILLE','Tél. : 04 86 11 09 14 – Email : bus3132@bus3132.org','SIRET 490 478 062 00014 – APE 8899B']};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  open:svg('<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'),
  share:svg('<path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 12v8h14v-8"/>'),
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  search:svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  trash:svg('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  mail:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
  file:svg('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>'),
  shield:svg('<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'),
  pen:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>'),
  dl:svg('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
  print:svg('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M7 14h10v7H7z"/>'),
  up:svg('<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>'),
  upA:svg('<path d="m6 15 6-6 6 6"/>'), downA:svg('<path d="m6 9 6 6 6-6"/>')
};
const CAT_COLORS=['var(--navy)','var(--blue)','var(--orange)','var(--grey)','#178a47','#8a3ffc','#0f8b8d'];

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3000); }
const pad=n=>String(n).padStart(2,'0');
function frDate(iso){ if(!iso) return ''; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${d}/${m}/${y}`; }
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const sizeTxt=n=>!n?'':n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko';

/* ---------- Fenêtres ---------- */
let lastFocus=null;
function openModal(html,cls){
  lastFocus=document.activeElement;
  const box=$('#modal-box'); box.className='dialog'+(cls?' '+cls:''); box.innerHTML=html;
  $('#modal').hidden=false; document.body.style.overflow='hidden';
  const f=box.querySelector('[data-autofocus]')||box.querySelector('input,button'); f&&f.focus();
}
function closeModal(){
  if($('#modal').hidden) return;
  $('#modal').hidden=true; document.body.style.overflow=''; $('#modal-box').innerHTML='';
  lastFocus&&lastFocus.focus&&lastFocus.focus();
}
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'||e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function askConfirm(title,text,yes,fn,danger=true){
  openModal(`<h3 id="modal-title">${esc(title)}</h3><p>${text}</p>
    <div class="btns"><button class="${danger?'danger':'primary'}" id="cf-yes">${esc(yes)}</button><button class="secondary" data-close data-autofocus>Annuler</button></div>`);
  $('#cf-yes').onclick=()=>{ closeModal(); fn(); };
}
function askText(title,label,value,fn){
  openModal(`<h3 id="modal-title">${esc(title)}</h3><label class="field"><span>${esc(label)}</span><input class="in" id="pv" value="${esc(value)}" data-autofocus></label>
    <div class="btns"><button class="primary" id="pok">Valider</button><button class="secondary" data-close>Annuler</button></div>`);
  const go=()=>{ const v=$('#pv').value.trim(); if(!v) return; closeModal(); fn(v); };
  $('#pok').onclick=go; $('#pv').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); $('#pv').select();
}

/* ======================================================================
   CONNEXION (comme Annubus)
   ====================================================================== */
let sb=null, me=null, isAdmin=false;
function showAuth(msg,kind){
  $('#appwrap').hidden=true; $('#auth').hidden=false; $('#who').hidden=true; $('#logout').hidden=true;
  $('#nav').hidden=true; $('#account').hidden=true; document.body.classList.remove('has-nav');
  const m=$('#authMsg');
  if(msg){ m.hidden=false; m.className='notice'+(kind==='ok'?' ok':''); m.textContent=msg; } else m.hidden=true;
}
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#authEmail').value.trim().toLowerCase(); if(!email) return;
  $('#authSend').disabled=true;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
  $('#authSend').disabled=false;
  if(error){ showAuth(/rate|limit|seconds/i.test(error.message)?"Trop de demandes d'affilée. Attendez une minute puis réessayez.":"L'e-mail n'a pas pu être envoyé : "+error.message,'err'); return; }
  $('#authForm').hidden=true; $('#codeForm').hidden=false;
  showAuth(`E-mail envoyé à ${email}. Ouvrez le lien qu'il contient sur cet appareil, ou tapez ici le code à 6 chiffres.`,'ok');
  $('#authCode').focus();
});
$('#codeForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#authEmail').value.trim().toLowerCase(), token=$('#authCode').value.replace(/\s/g,'');
  if(!token) return;
  const {error}=await sb.auth.verifyOtp({email,token,type:'email'});
  if(error) showAuth('Code incorrect ou expiré. Redemandez un e-mail.','err');
});
$('#authBack').addEventListener('click',()=>{ $('#codeForm').hidden=true; $('#authForm').hidden=false; $('#authMsg').hidden=true; });
function askLogout(){ askConfirm('Se déconnecter ?','Il faudra recevoir un nouvel e-mail pour revenir dans Docubus sur cet appareil.','Se déconnecter',async()=>{
  clearAll(); await sb.auth.signOut(); location.reload();
},false); }
$('#logout').addEventListener('click',askLogout);
$('#account').addEventListener('click',()=>{
  openModal(`<h3 id="modal-title">Mon compte</h3><p>Connecté avec <b>${esc(me)}</b>${isAdmin?' · administrateur':''}.</p>
    <div class="btns"><button class="secondary" id="acc-install">Installer l'appli sur ce téléphone</button>
    <button class="danger" id="acc-logout">Se déconnecter</button><button class="secondary" data-close>Fermer</button></div>`);
  $('#acc-install').onclick=()=>{ closeModal(); showHowto(); };
  $('#acc-logout').onclick=()=>{ closeModal(); askLogout(); };
});

let started=false;
async function startApp(session){
  if(started) return; started=true;
  const email=(session.user.email||'').toLowerCase();
  const {data:m,error}=await sb.from('membres').select('email, admin').eq('email',email).maybeSingle();
  if(error){ started=false; showAuth('Impossible de vérifier vos droits. Vérifiez la connexion puis rechargez la page.','err'); return; }
  if(!m){
    started=false; await sb.auth.signOut();
    $('#authForm').hidden=false; $('#codeForm').hidden=true;
    showAuth(`L'adresse ${email} n'est pas autorisée. Demandez à ${CFG.contactAcces||'un administrateur'} de vous ajouter dans l'annuaire, puis réessayez.`,'err');
    return;
  }
  me=email; isAdmin=!!m.admin;
  $('#auth').hidden=true; $('#appwrap').hidden=false;
  $('#who').hidden=false; $('#who').textContent='Connecté : '+email+(isAdmin?' · administrateur':'');
  $('#logout').hidden=false;
  $('#nav').hidden=false; document.body.classList.add('has-nav');
  const ini=email.split('@')[0].split(/[._-]+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'?';
  $('#account').textContent=ini; $('#account').hidden=false;
  document.querySelector('[data-tab=admin]').hidden=!isAdmin;

async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
async function loadAll(quiet){

let query='', filter='all';
function kind(f){ const x=(String(f).split('.').pop()||'').toLowerCase();
  if(x==='pdf') return ['pdf','PDF']; if(['doc','docx','odt','rtf'].includes(x)) return ['doc',x.toUpperCase().slice(0,4)];
  if(['xls','xlsx','ods','csv'].includes(x)) return ['xls',x.toUpperCase().slice(0,4)]; if(['jpg','jpeg','png','webp'].includes(x)) return ['img','IMG'];
  return ['',x.toUpperCase().slice(0,4)]; }
const canShareFiles=!!(navigator.canShare&&(()=>{ try{ return navigator.canShare({files:[new File(['x'],'t.pdf',{type:'application/pdf'})]}); }catch(e){ return false; } })());

async function fileOf(d){ return q(sb.storage.from(BUCKET).download(d.chemin)); }
async function downloadDoc(d,btn){
  try{ btn&&(btn.disabled=true);
    const blob=await fileOf(d), u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=d.nom_fichier||'document'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000); toast('Téléchargement lancé');
  }catch(e){ toast('Téléchargement impossible.'); } finally{ btn&&(btn.disabled=false); }
}
/* Impression directe (ordinateur) : le fichier est chargé dans un cadre invisible, puis la fenêtre d'impression s'ouvre */
async function printDoc(d,btn){
  try{ btn&&(btn.disabled=true); toast('Préparation de l\u2019impression…');
    const blob=await fileOf(d), u=URL.createObjectURL(blob);
    const old=document.getElementById('print-frame'); old&&old.remove();
    const f=document.createElement('iframe'); f.id='print-frame'; f.setAttribute('aria-hidden','true');
    f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
    if(/\.pdf$/i.test(d.nom_fichier)) f.src=u;
    else f.srcdoc=`<html><body style="margin:0"><img src="${u}" style="max-width:100%"></body></html>`;
    f.onload=()=>setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.open(u,'_blank'); } },300);
    document.body.appendChild(f);
    setTimeout(()=>URL.revokeObjectURL(u),10*60000);
  }catch(e){ toast('Impression impossible : ouvrez le document puis imprimez-le.'); } finally{ btn&&(btn.disabled=false); }
}

const GEN_ROW=()=>`<div class="doc gen"><div class="ico">${ICON.pen}</div><div class="t"><a href="#delivrance" data-goto="deliv">Remplir une attestation en ligne</a><small>Formulaire puis envoi par mail au CSAPA de suivi</small></div><div class="act"><button class="iconbtn" data-goto="deliv" aria-label="Remplir une attestation">${ICON.open}</button></div></div>`;
function renderDocs(){

/* Envoyer un document vierge par mail (pour l'imprimer au bureau, par exemple).
   Le fichier est préparé dès l'ouverture de la fenêtre : le bouton Partager peut
   alors ouvrir Outlook directement (le téléphone l'exige dans le même geste). */
function sendDoc(d){
  let file=null, to=envoi[0]||'';
  const href=signed.get(d.chemin)||'#';
  const subj=`Docubus – ${d.titre}`;
  openModal(`<h3 id="modal-title">Envoyer « ${esc(d.titre)} »</h3>
    <div class="field"><span>À</span>
      <div class="dest-chips" id="sd-to">${envoi.map((a,i)=>`<button type="button" class="chip" data-to="${esc(a)}" aria-pressed="${i===0}">${esc(a)}</button>`).join('')}</div>
      <input class="in" id="sd-other" type="email" placeholder="ou une autre adresse" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="step">
      ${canShareFiles
        ?`<p>L'adresse est copiée en même temps : choisissez <b>Outlook</b>, puis dans <b>À</b> : appui long → <b>Coller</b>.</p>
          <button class="primary orange" id="sd-share" disabled>${ICON.share}<span>Préparation du fichier…</span></button>`
        :`<p>Ce navigateur ne peut pas joindre le fichier : le mail contiendra un lien valable 1 heure.</p>
          <a class="primary orange" id="sd-mailto" href="#">${ICON.mail}Ouvrir le mail</a>`}
    </div>
    <div class="row"><a class="secondary" href="${esc(href)}" target="_blank" rel="noopener">${ICON.open}Ouvrir</a><button class="secondary" id="sd-dl">${ICON.dl}Télécharger</button></div>
    <button class="ghost" data-close>Fermer</button>`,'send');
  const box=$('#modal-box');
  const current=()=>{ const o=box.querySelector('#sd-other').value.trim(); return o||to; };
  box.querySelector('#sd-dl').onclick=e=>downloadDoc(d,e.currentTarget);
  box.querySelector('#sd-to').onclick=e=>{ const b=e.target.closest('[data-to]'); if(!b) return; to=b.dataset.to; box.querySelector('#sd-other').value='';
    box.querySelectorAll('#sd-to .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); };
  const mt=box.querySelector('#sd-mailto');
  if(mt) mt.onclick=e=>{ const a=current(); if(!MAIL.test(a)){ e.preventDefault(); toast('Adresse incorrecte.'); return; }
    mt.href=`mailto:${encodeURIComponent(a)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent('Document : '+d.titre+'\n'+(signed.get(d.chemin)||''))}`; };
  const sh=box.querySelector('#sd-share');
  if(sh){
    q(sb.storage.from(BUCKET).download(d.chemin)).then(blob=>{
      file=new File([blob],d.nom_fichier,{type:blob.type||d.type||'application/octet-stream'});
      sh.disabled=false; sh.querySelector('span').textContent='Partager vers Outlook';
    }).catch(()=>{ sh.querySelector('span').textContent='Fichier indisponible'; });
    sh.onclick=async()=>{
      const a=current(); if(!MAIL.test(a)){ toast('Adresse incorrecte.'); return; }
      copyText(a);
      try{ await navigator.share({files:[file],title:subj}); toast('Adresse copiée : collez-la dans « À »'); }
      catch(err){ if(err&&err.name!=='AbortError') toast('Partage impossible : '+(err.message||err.name)); }
    };
  }
}

let logoData=null;
function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoAdd(iso,days){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d+days); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function isoDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function weekday(iso){ return iso?isoDate(iso).toLocaleDateString('fr-FR',{weekday:'long'}):''; }
let uid=0;
function newDate(prev){ return {id:++uid,d:prev&&prev.d?isoAdd(prev.d,1):isoToday(),mg:prev?prev.mg:''}; }
function newPatient(){ return {id:++uid,civ:'',ini:'',ddn:'',dossier:'',trt:'',forme:'',comment:'',dates:[newDate()]}; }
function blank(){ return {date:isoToday(),csapa:'',libreNom:'',libreMail:'',attention:'',patients:[newPatient()]}; }
let F=blank(), showErrors=false, files=[], urls=[];
const FORMES={metha:['Sirop','Gélules'],bupre:['Comprimé sublingual','Lyophilisat oral (Orobupré)']};
const TRT_NAME={metha:'Méthadone',bupre:'Buprénorphine'};

function dest(){
  if(F.csapa==='libre') return {structure:F.libreNom.trim(),adresses:splitMails(F.libreMail)};
  const l=dests.find(x=>x.id===F.csapa); return l?{structure:l.structure||l.nom,adresses:l.adresses||[]}:null;
}
function splitMails(s){ return String(s||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean); }
const MAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function parseDose(v){ const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:NaN; }
function fmtDose(v){ return (Math.round(parseDose(v)*100)/100).toString().replace('.',','); }
/* Dose en toutes lettres (orthographe traditionnelle : vingt et un, quatre-vingts, deux cents…) */
const UNITS=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const TENS={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
function lt100(n){
  if(n<17) return UNITS[n]; if(n<20) return 'dix-'+UNITS[n-10];
  const t=Math.floor(n/10),u=n%10;
  if(t<7) return TENS[t]+(u===0?'':u===1?' et un':'-'+UNITS[u]);
  if(t===7) return 'soixante'+(u===1?' et onze':'-'+lt100(10+u));
  if(t===8) return u===0?'quatre-vingts':'quatre-vingt-'+UNITS[u];
  return 'quatre-vingt-'+lt100(10+u);
}
function lt1000(n){
  if(n===1000) return 'mille';
  const h=Math.floor(n/100),r=n%100; if(!h) return lt100(r);
  const hs=h===1?'cent':UNITS[h]+' cent';
  return r?hs+' '+lt100(r):(h>1?hs+'s':hs);
}
function doseLettres(v){
  const n=parseDose(v); if(!(n>=0)||n>1000) return '';
  const [ent,dec]=fmtDose(v).split(',');
  let txt=lt1000(+ent);
  if(dec){ const zeros=dec.match(/^0*/)[0].length; txt+=' virgule '+(zeros?Array(zeros).fill('zéro').join(' ')+' ':'')+(+dec.slice(zeros)?lt100(+dec.slice(zeros)):'').trim(); txt=txt.trim(); }
  return txt+(n<2?' milligramme':' milligrammes');
}
function parseDDN(s){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); if(!m) return null;
  const d=+m[1],mo=+m[2],y=+m[3],t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d) return null;
  if(y<1900||t>new Date()) return null; return t;
}
function validate(){
  const errs=[],bad=new Set();
  if(!F.date){ errs.push('Date du document manquante.'); bad.add('date'); }
  if(F.csapa===''||(F.csapa!=='libre'&&!dest())){ errs.push('Choisissez le CSAPA de suivi.'); bad.add('csapa'); }
  if(F.csapa==='libre'){
    if(!F.libreNom.trim()){ errs.push('Indiquez le nom de la structure.'); bad.add('libreNom'); }
    const m=splitMails(F.libreMail);
    if(!m.length||m.some(x=>!MAIL.test(x))){ errs.push('Adresse mail du destinataire manquante ou incorrecte.'); bad.add('libreMail'); }
  }
  F.patients.forEach((p,i)=>{
    const P=`Patient ${i+1} : `;
    if(!p.civ){ errs.push(P+'choisissez M. ou Mme.'); bad.add(p.id+'civ'); }
    if(!p.ini.trim()){ errs.push(P+'initiales manquantes.'); bad.add(p.id+'ini'); }
    if(!parseDDN(p.ddn)){ errs.push(P+'date de naissance incorrecte (JJ/MM/AAAA).'); bad.add(p.id+'ddn'); }
    if(!p.trt){ errs.push(P+'choisissez le traitement.'); bad.add(p.id+'trt'); }
    const seen=new Set();
    p.dates.forEach((d,j)=>{
      if(!d.d){ errs.push(P+`date de délivrance n° ${j+1} manquante.`); bad.add(d.id+'d'); }
      else if(seen.has(d.d)){ errs.push(P+`la date du ${frDate(d.d)} est en double.`); bad.add(d.id+'d'); }
      seen.add(d.d);
      const n=parseDose(d.mg);
      if(!(n>0)||n>1000){ errs.push(P+`dose manquante pour le ${d.d?frDate(d.d):'n° '+(j+1)}.`); bad.add(d.id+'mg'); }
    });
  });
  return {errs,bad};
}

/* Tampon de l'association : image privée (stockage Supabase, lisible par les seuls membres) */
async function loadTampon(){
  if(!tampon) return null;
  if(tamponData) return tamponData;
  const blob=await fileOf(tampon);
  const url=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob); });
  const dim=await new Promise(res=>{ const im=new Image(); im.onload=()=>res([im.naturalWidth,im.naturalHeight]); im.onerror=()=>res([1,1]); im.src=url; });
  tamponData={url,fmt:/png/i.test(blob.type||tampon.type||'')?'PNG':'JPEG',w:dim[0],h:dim[1]};
  return tamponData;
}
async function loadLogo(){
  if(logoData) return logoData;
  const b=await (await fetch('img/logo-association.jpg')).blob();
  logoData=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
  return logoData;
}
function makePdf(pt,logo,tp){

  doc.setFontSize(8.5); doc.setTextColor(...INK);

  doc.setTextColor(...GREY); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text('CONFIDENTIEL – DONNÉES DE SANTÉ',R,16,{align:'right'});
  doc.setTextColor(...NAVY); doc.setFontSize(16);
  doc.text('Attestation de',R,30,{align:'right'}); doc.text('délivrance exceptionnelle',R,37.5,{align:'right'});
  doc.setDrawColor(...ORANGE); doc.setLineWidth(1.2); doc.line(R-62,41.5,R,41.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...GREY);
  doc.text('Traitement de substitution aux opiacés',R,47,{align:'right'});
  let y=72;
  doc.setTextColor(...INK); doc.setFontSize(11.5); doc.setFont('helvetica','normal');
  doc.text(`${st.ville||'Marseille'}, le ${frDate(F.date)}`,L,y); y+=12;
  doc.setFont('helvetica','bold'); doc.text("À l'attention de :",L,y);
  doc.setFont('helvetica','normal');
  const att=[D.structure,F.attention.trim()].filter(Boolean);
  att.forEach((t,i)=>{ doc.text(doc.splitTextToSize(t,W-36),L+36,y+i*6); }); y+=Math.max(1,att.length)*6+8;
  const fem=pt.civ==='Mme';
  const who=`${pt.civ} ${pt.ini.trim()}`+(pt.dossier.trim()?` (n° de dossier : ${pt.dossier.trim()})`:'');
  const body=`L'équipe du ${st.nom||'Bus 31/32'} vous informe que ${who}, né${fem?'e':''} le ${pt.ddn}, a bénéficié à titre exceptionnel, dans notre structure, de la délivrance de son traitement aux dates suivantes :`;
  const lines=doc.splitTextToSize(body,W);
  doc.text(lines,L,y,{lineHeightFactor:1.45}); y+=lines.length*11.5*0.3528*1.45+6;
  const trt=TRT_NAME[pt.trt]+(pt.forme?` (${pt.forme.charAt(0).toLowerCase()+pt.forme.slice(1)})`:'');
  const cols=[L,L+46,L+96],hdrH=9,LH=4.6;
  const footTop=297-14-((st.pied||[]).length)*4-8;
  const header=()=>{
    doc.setFillColor(...NAVY); doc.rect(L,y,W,hdrH,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Date',cols[0]+3,y+6); doc.text('Traitement',cols[1]+3,y+6); doc.text('Dose du jour',cols[2]+3,y+6);
    doc.setTextColor(...INK); top=y; y+=hdrH;
  };
  const frame=()=>{ doc.setDrawColor(...NAVY); doc.setLineWidth(.3); doc.rect(L,top,W,y-top); };
  let top=y; header();
  const sorted=[...pt.dates].sort((a,b)=>a.d.localeCompare(b.d));
  sorted.forEach((x,i)=>{
    doc.setFontSize(10.5); doc.setFont('helvetica','normal');
    const trtL=doc.splitTextToSize(trt,cols[2]-cols[1]-5);
    doc.setFontSize(9.5); doc.setFont('helvetica','italic');
    const letL=doc.splitTextToSize('('+doseLettres(x.mg)+')',R-cols[2]-5);
    const h=Math.max(trtL.length,1+letL.length)*LH+4.4;
    if(y+h>footTop){ frame(); doc.addPage(); y=25; header(); }   // tableau trop long : suite page suivante
    if(i%2===0){ doc.setFillColor(243,245,249); doc.rect(L,y,W,h,'F'); }
    const wd=weekday(x.d);
    doc.setFontSize(10.5); doc.setFont('helvetica','normal');
    doc.text(`${wd.charAt(0).toUpperCase()+wd.slice(1)} ${frDate(x.d)}`,cols[0]+3,y+5.6);
    doc.text(trtL,cols[1]+3,y+5.6,{lineHeightFactor:1.25});
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.text(`${fmtDose(x.mg)} mg`,cols[2]+3,y+5.6);
    doc.setFontSize(9.5); doc.setFont('helvetica','italic'); doc.text(letL,cols[2]+3,y+5.6+LH,{lineHeightFactor:1.25});
    y+=h;
  });
  doc.setFont('helvetica','normal');
  frame();
  y+=10;
  const room=need=>{ if(y+need>footTop){ doc.addPage(); y=25; } };
  doc.setTextColor(...INK);
  const com=(pt.comment||'').trim();
  if(com){
    doc.setFontSize(11.5); doc.setFont('helvetica','bold');
    room(12); doc.text('Commentaire :',L,y); y+=6;
    doc.setFont('helvetica','normal');
    doc.splitTextToSize(com,W).forEach(line=>{ room(6); doc.text(line,L,y); y+=5.6; });
    y+=6;
  }
  doc.setFontSize(11.5); doc.setFont('helvetica','normal');
  let tw=0,th=0; if(tp){ tw=40; th=tw*tp.h/tp.w; if(th>32){ th=32; tw=th*tp.w/tp.h; } }

  doc.text("N'hésitez pas à nous contacter pour toute information complémentaire.",L,y); y+=16;
  doc.setFont('helvetica','bold'); doc.setTextColor(...NAVY);
  doc.text(st.signataire,R,y,{align:'right'});
  if(tp){ try{ doc.addImage(tp.url,tp.fmt,R-tw,y+3,tw,th); }catch(e){ console.error(e); } }
  const pied=st.pied||[]; const fy=297-12-(pied.length-1)*4;

  doc.setDrawColor(...ORANGE); doc.setLineWidth(.6); doc.line(L+40,fy-6,R-40,fy-6);
  doc.setFontSize(8); doc.setTextColor(...GREY);
  pied.forEach((t,i)=>{ doc.setFont('helvetica',i===0?'bold':'normal'); doc.text(t,105,fy+i*4,{align:'center'}); });
  }
  return doc.output('blob');
}
function subject(){ return `${structure.nom} – Délivrance exceptionnelle – ${frDate(F.date)}`; }

async function prepare(){

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(()=>true,()=>fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){ const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} a.remove(); return ok; }
function showSend(){

      <div class="addr">${D.adresses.map(esc).join('<br>')}</div>
      <div class="row"><button class="secondary" id="cp-addr">${ICON.copy}Copier les adresses</button><button class="secondary" id="cp-subj">${ICON.copy}Copier l'objet</button></div>
    </div>

  const box=$('#modal-box');
  box.querySelector('#cp-addr').onclick=()=>copyText(addrs).then(ok=>toast(ok?'Adresses copiées':'Copie impossible'));

    catch(err){ if(err&&err.name!=='AbortError') toast('Partage impossible : '+(err.message||err.name)); }
  };
  const dl=box.querySelector('#do-dl');
  if(dl) dl.onclick=()=>{ files.forEach((f,i)=>{ const a=document.createElement('a'); a.href=urls[i]; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }); box.querySelector('#st1').classList.add('done'); };

  const catOpts=sel=>cats.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.nom)}</option>`).join('');
  const qrows=queue.map((qq,i)=>`<div class="prow" data-q="${i}">
      <div><input class="in" data-qk="titre" value="${esc(qq.titre)}" aria-label="Titre du document"><small>${esc(qq.file.name)} · ${sizeTxt(qq.file.size)}</small></div>
      <select class="in" data-qk="categorie" aria-label="Catégorie">${catOpts(qq.categorie)}</select>
      <button class="iconbtn" data-qdel="${i}" aria-label="Retirer">${ICON.trash}</button></div>`).join('');
  const list=cats.map((c,ci)=>{
    const ds=docs.filter(d=>d.categorie===c.id).sort((a,b)=>a.titre.localeCompare(b.titre,'fr'));
    return `<div class="card" data-cat="${esc(c.id)}">
      <div class="cathead"><h3>${esc(c.nom)} <span class="hint">(${ds.length})</span></h3>
        <button class="mini" data-cact="up" ${ci===0?'disabled':''} aria-label="Monter">${ICON.upA}</button>
        <button class="mini" data-cact="down" ${ci===cats.length-1?'disabled':''} aria-label="Descendre">${ICON.downA}</button>
        <button class="mini" data-cact="rename">Renommer</button>
        <button class="mini red" data-cact="del" aria-label="Supprimer la catégorie">${ICON.trash}</button></div>
      ${ds.map(d=>`<div class="arow" data-doc="${esc(d.id)}">
        <div class="t"><a href="${esc(signed.get(d.chemin)||'#')}" target="_blank" rel="noopener">${esc(d.titre)}</a>
          <small>${esc(d.nom_fichier)} · ${sizeTxt(d.taille)} · ${dateTxt(d)}${d.maj_par?' · par '+esc(d.maj_par):''}</small></div>
        <div class="acts"><button class="mini" data-dact="version">${ICON.up}Nouvelle version</button>
          <button class="mini" data-dact="rename">Renommer</button>
          <select class="mini" data-dact="move" aria-label="Déplacer vers">${cats.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${x.id===c.id?'Déplacer…':esc(x.nom)}</option>`).join('')}</select>
          <button class="mini red" data-dact="del">${ICON.trash}Supprimer</button></div></div>`).join('')||'<p class="hint">Aucun document.</p>'}
    </div>`; }).join('');
  box.innerHTML=`<div class="panel">
    <div class="card top" style="--g:var(--orange)">
      <h3>Ajouter des documents</h3>
      <label class="drop" id="drop">${ICON.up}<b>Choisir des fichiers</b><span class="hint">ou glissez-les ici sur ordinateur · PDF, Word, Excel, images · ${MAX_MB} Mo max</span>
        <input type="file" id="pick" multiple accept=".pdf,.doc,.docx,.odt,.rtf,.xls,.xlsx,.ods,.csv,.jpg,.jpeg,.png" hidden></label>
      ${queue.length?`<div class="pending">${qrows}</div>
        <div class="row end"><button class="secondary" id="qclear">Vider</button><button class="primary orange" id="qsend">${ICON.up}Déposer ${queue.length} fichier${queue.length>1?'s':''}</button></div>`:''}
      <div id="ulog"></div>
    </div>
    <div class="row between"><div class="lab">Catégories</div><button class="secondary" id="addcat">${ICON.plus}Nouvelle catégorie</button></div>
    ${list||'<p class="hint">Aucune catégorie.</p>'}
  </div>`;
  const drop=$('#drop'),pick=$('#pick');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  pick.addEventListener('change',()=>{ addFiles(pick.files); pick.value=''; });
  box.oninput=e=>{ const r=e.target.closest('[data-q]'); if(r&&e.target.dataset.qk) queue[+r.dataset.q][e.target.dataset.qk]=e.target.value; };
  box.onchange=e=>{ const r=e.target.closest('[data-q]'); if(r&&e.target.dataset.qk) queue[+r.dataset.q][e.target.dataset.qk]=e.target.value;
    if(e.target.dataset.dact==='move'){ const id=e.target.closest('[data-doc]').dataset.doc, to=e.target.value; act(async()=>q(sb.from('docubus_documents').update({categorie:to}).eq('id',id)),'Document déplacé'); } };
  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.qdel!==undefined){ queue.splice(+b.dataset.qdel,1); adminDocs(); }
    if(b.id==='qclear'){ queue=[]; adminDocs(); }
    if(b.id==='qsend') uploadQueue();
    if(b.id==='addcat') askText('Nouvelle catégorie','Nom de la catégorie','',addCat);
    if(b.dataset.cact) catAction(b.closest('[data-cat]').dataset.cat,b.dataset.cact);
    if(b.dataset.dact) docAction(b.closest('[data-doc]').dataset.doc,b.dataset.dact);
  };
}
function addFiles(list){
  const def=(queue[queue.length-1]||{}).categorie||(cats[0]&&cats[0].id);
  [...list].forEach(f=>{ if(f.size>MAX_MB*1048576){ toast(`${f.name} : trop gros (${MAX_MB} Mo max).`); return; } queue.push({file:f,titre:cleanTitle(f.name),categorie:def}); });
  adminDocs();
}
function ulog(html,cls){ const l=$('#ulog'); if(!l) return; l.className='log'; l.insertAdjacentHTML('beforeend',`<div class="${cls||''}">${html}</div>`); l.scrollTop=l.scrollHeight; }
const extOf=n=>(String(n).split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
async function uploadQueue(){
  if(queue.some(x=>!x.titre.trim())){ toast('Chaque document doit avoir un titre.'); return; }
  $('#asub').querySelectorAll('button').forEach(b=>b.disabled=true);
  const logs=[]; let ok=0;
  for(const it of queue.slice()){
    const path=`${it.categorie}/${rid()}.${extOf(it.file.name)}`;
    try{
      await q(sb.storage.from(BUCKET).upload(path,it.file,{contentType:it.file.type||undefined,upsert:false}));
      try{ await q(sb.from('docubus_documents').insert({titre:it.titre.trim(),categorie:it.categorie,chemin:path,nom_fichier:it.file.name,type:it.file.type||null,taille:it.file.size})); }
      catch(e){ await sb.storage.from(BUCKET).remove([path]); throw e; }
      queue.splice(queue.indexOf(it),1); ok++; logs.push(['✓ '+esc(it.titre),'ok']);
    }catch(e){ logs.push(['✗ '+esc(it.titre)+' : '+esc(errMsg(e)),'ko']); }
  }
  await loadAll(true);
  logs.forEach(([h,c])=>ulog(h,c));
  if(ok) toast(`${ok} document${ok>1?'s':''} ajouté${ok>1?'s':''}`);
}
function addCat(nom){
  let id=slug(nom),i=2; while(cats.some(c=>c.id===id)) id=slug(nom)+'-'+i++;
  const ordre=Math.max(0,...cats.map(c=>c.ordre||0))+1;
  act(async()=>q(sb.from('docubus_categories').insert({id,nom,ordre})),'Catégorie ajoutée');
}
function catAction(id,a){
  const i=cats.findIndex(c=>c.id===id),c=cats[i];
  if(a==='up'||a==='down'){ const o=cats[a==='up'?i-1:i+1];
    // on renumérote tout pour éviter les égalités
    const order=cats.map(x=>x.id); const j=order.indexOf(o.id); [order[i],order[j]]=[order[j],order[i]];
    act(async()=>{ for(let k=0;k<order.length;k++) await q(sb.from('docubus_categories').update({ordre:k+1}).eq('id',order[k])); }); }
  if(a==='rename') askText('Renommer la catégorie','Nouveau nom',c.nom,v=>act(async()=>q(sb.from('docubus_categories').update({nom:v}).eq('id',id)),'Catégorie renommée'));
  if(a==='del'){
    if(id===GEN_CAT){ toast('Cette catégorie contient le lien vers le formulaire de délivrance : elle ne peut pas être supprimée.'); return; }
    if(docs.some(d=>d.categorie===id)){ toast("Déplacez ou supprimez d'abord les documents de cette catégorie."); return; }
    askConfirm('Supprimer la catégorie ?',`« ${esc(c.nom)} » disparaîtra de l'appli.`,'Supprimer',()=>act(async()=>q(sb.from('docubus_categories').delete().eq('id',id)),'Catégorie supprimée'));
  }
}
function docAction(id,a){
  const d=docs.find(x=>x.id===id); if(!d) return;
  if(a==='rename') askText('Renommer le document',"Titre affiché dans l'appli",d.titre,v=>act(async()=>q(sb.from('docubus_documents').update({titre:v}).eq('id',id)),'Document renommé'));
  if(a==='del') askConfirm('Supprimer ce document ?',`« ${esc(d.titre)} » sera supprimé définitivement.`,'Supprimer',()=>act(async()=>{
    await q(sb.from('docubus_documents').delete().eq('id',id));
    await sb.storage.from(BUCKET).remove([d.chemin]);
  },'Document supprimé'));
  if(a==='version'){
    const inp=document.createElement('input'); inp.type='file';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
      if(f.size>MAX_MB*1048576){ toast(`Fichier trop gros (${MAX_MB} Mo max).`); return; }
      const path=`${d.categorie}/${rid()}.${extOf(f.name)}`;
      toast('Envoi de la nouvelle version…');
      act(async()=>{
        await q(sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||undefined,upsert:false}));
        try{ await q(sb.from('docubus_documents').update({chemin:path,nom_fichier:f.name,type:f.type||null,taille:f.size}).eq('id',id)); }
        catch(e){ await sb.storage.from(BUCKET).remove([path]); throw e; }
        await sb.storage.from(BUCKET).remove([d.chemin]);
      },'Nouvelle version déposée');
    };
    inp.click();
  }
}

/* -- Destinataires -- */
let destDraft=null;
function adminDests(){
  if(!destDraft) destDraft=dests.map(x=>({...x,adresses:[...(x.adresses||[])],_dirty:false}));
  const box=$('#asub');
  box.innerHTML=`<div class="panel">
    <p class="hint">Chaque destinataire apparaît dans la liste « CSAPA de suivi » du formulaire de délivrance.</p>
    ${destDraft.map((l,i)=>`<div class="card top" data-l="${i}" style="--g:var(--blue)">
      <div class="cathead"><h3>${esc(l.nom||'Nouveau destinataire')}</h3>
        <button class="mini" data-lact="up" ${i===0||!l.id?'disabled':''} aria-label="Monter">${ICON.upA}</button>
        <button class="mini" data-lact="down" ${i===destDraft.length-1||!(destDraft[i+1]||{}).id||!l.id?'disabled':''} aria-label="Descendre">${ICON.downA}</button>
        <button class="mini red" data-lact="del">${ICON.trash}Supprimer</button></div>
      <div class="grid2">
        <label class="field"><span>Nom dans la liste</span><input class="in" data-lk="nom" value="${esc(l.nom)}" placeholder="ex. Puget"></label>
        <label class="field"><span>Nom imprimé sur le PDF</span><input class="in" data-lk="structure" value="${esc(l.structure)}" placeholder="ex. CSAPA Puget Corderie"></label>
      </div>
      <label class="field"><span>À l'attention de <small>(facultatif, prérempli)</small></span><input class="in" data-lk="attention" value="${esc(l.attention)}" placeholder="ex. Dr …"></label>
      <label class="field"><span>Adresses mail <small>(une par ligne)</small></span><textarea class="in" data-lk="adresses" rows="2" spellcheck="false" autocapitalize="off">${esc((l.adresses||[]).join('\n'))}</textarea></label>
      ${l.maj_par?`<span class="who">Modifié le ${frDate(l.maj)} par ${esc(l.maj_par)}</span>`:''}
      <div class="row end"><button class="primary orange" data-lact="save" ${l._dirty?'':'disabled'}>Enregistrer</button></div>
    </div>`).join('')}
    <div><button class="secondary" id="addl">${ICON.plus}Ajouter un destinataire</button></div>
  </div>`;
  box.oninput=e=>{ const c=e.target.closest('[data-l]'); if(!c||!e.target.dataset.lk) return;
    const l=destDraft[+c.dataset.l],k=e.target.dataset.lk;
    l[k]=k==='adresses'?e.target.value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean):e.target.value;
    if(k==='nom') c.querySelector('h3').textContent=e.target.value||'Nouveau destinataire';
    l._dirty=true; c.querySelector('[data-lact=save]').disabled=false; };
  box.onchange=null;
  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.id==='addl'){ destDraft.push({nom:'',structure:'',attention:'',adresses:[],_dirty:true}); adminDests(); const cs=box.querySelectorAll('[data-l]'); cs[cs.length-1].querySelector('input').focus(); return; }
    const c=b.closest('[data-l]'); if(!c) return; const i=+c.dataset.l,l=destDraft[i];
    if(b.dataset.lact==='save') saveDest(l);
    if(b.dataset.lact==='del'){
      if(!l.id){ destDraft.splice(i,1); adminDests(); return; }
      askConfirm('Supprimer ce destinataire ?',`« ${esc(l.nom)} » disparaîtra de la liste.`,'Supprimer',()=>{ destDraft=null; act(async()=>q(sb.from('docubus_destinataires').delete().eq('id',l.id)),'Destinataire supprimé'); });
    }
    if(b.dataset.lact==='up'||b.dataset.lact==='down'){
      const saved=destDraft.filter(x=>x.id).map(x=>x.id); const a=saved.indexOf(l.id),j=b.dataset.lact==='up'?a-1:a+1;
      [saved[a],saved[j]]=[saved[j],saved[a]]; destDraft=null;
      act(async()=>{ for(let k=0;k<saved.length;k++) await q(sb.from('docubus_destinataires').update({ordre:k+1}).eq('id',saved[k])); });
    }
  };
}
function saveDest(l){
  const errs=[];
  if(!String(l.nom).trim()) errs.push('nom dans la liste manquant');
  if(!String(l.structure).trim()) errs.push('nom imprimé sur le PDF manquant');
  if(!l.adresses.length) errs.push('aucune adresse mail');
  l.adresses.forEach(a=>{ if(!MAIL.test(a)) errs.push(`adresse incorrecte « ${a} »`); });
  if(errs.length){ toast('À corriger : '+errs.join(', ')+'.'); return; }
  const row={nom:l.nom.trim(),structure:l.structure.trim(),attention:(l.attention||'').trim(),adresses:l.adresses};
  destDraft=null;
  act(async()=>{
    if(l.id) await q(sb.from('docubus_destinataires').update(row).eq('id',l.id));
    else await q(sb.from('docubus_destinataires').insert({...row,ordre:Math.max(0,...dests.map(x=>x.ordre||0))+1}));
  },'Destinataire enregistré');
}

      ${tampon?'<button class="ghost red" id="tp-del">Retirer le tampon</button>':''}

      catch(err){ await sb.storage.from(BUCKET).remove([path]); throw err; }
      if(old) await sb.storage.from(BUCKET).remove([old]);
    },'Tampon enregistré');

  const del=$('#tp-del'); if(del) del.onclick=()=>askConfirm('Retirer le tampon ?','Les prochaines attestations seront sans tampon.','Retirer',()=>{
