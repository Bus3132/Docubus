<script>
(function(){
'use strict';
/* ======================================================================
   DocuBus — page admin.
   Principe de sécurité :
   - Le site n'a pas de serveur. Pour modifier les fichiers, la page utilise
     une clé d'accès GitHub limitée au seul dépôt DocuBus.
   - Cette clé est stockée dans config/cle.json, CHIFFRÉE avec le code admin
     (PBKDF2-SHA256, 600 000 itérations, puis AES-GCM 256 bits).
   - Le code n'est jamais enregistré. La clé déchiffrée reste en mémoire
     le temps de la session ; fermer l'onglet la fait disparaître.
   ====================================================================== */
const OWNER='Bus3132', REPO='docubus', BRANCH='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const KEYFILE='config/cle.json', DOCS='config/documents.json', LISTS='config/listes.json', STRUCT='config/structure.json';
const ITER=600000, MIN_CODE=16, MAX_MB=25;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');
const ICON={
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  upA:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>',
  downA:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }
function openModal(html){ const b=$('#modal-box'); b.innerHTML=html; $('#modal').hidden=false; const f=b.querySelector('[data-autofocus]')||b.querySelector('input,button'); f&&f.focus(); }
function closeModal(){ $('#modal').hidden=true; $('#modal-box').innerHTML=''; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'||e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function confirmBox(title,text,yes,fn,danger=true){
  openModal(`<h3 id="modal-title">${esc(title)}</h3><p>${text}</p><div class="btns"><button class="${danger?'danger':'primary'}" id="cf">${esc(yes)}</button><button class="secondary" data-close>Annuler</button></div>`);
  $('#cf').onclick=()=>{ closeModal(); fn(); };
}
function promptBox(title,label,value,fn,extra=''){
  openModal(`<h3 id="modal-title">${esc(title)}</h3>${extra}<label class="field"><span>${esc(label)}</span><input class="in" id="pv" value="${esc(value)}" data-autofocus></label>
    <div class="btns"><button class="primary" id="pok">Valider</button><button class="secondary" data-close>Annuler</button></div>`);
  const go=()=>{ const v=$('#pv').value.trim(); if(!v) return; closeModal(); fn(v); };
  $('#pok').onclick=go; $('#pv').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  const i=$('#pv'); i.select();
}

/* ---------- Encodage ---------- */
function bytesToB64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBytes(b64){ const s=atob(b64.replace(/\s/g,'')); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
const utf8ToB64=str=>bytesToB64(new TextEncoder().encode(str));
const b64ToUtf8=b64=>new TextDecoder().decode(b64ToBytes(b64));
function fileToB64(file){ return file.arrayBuffer().then(b=>bytesToB64(new Uint8Array(b))); }

/* ---------- Chiffrement de la clé ---------- */
async function deriveKey(code,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptToken(token,code,expire){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(code,salt,ITER);
  const data=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(token)));
  return { version:1, algo:'PBKDF2-SHA256 + AES-GCM-256', iterations:ITER, salt:bytesToB64(salt), iv:bytesToB64(iv), data:bytesToB64(data),
           modifie:new Date().toISOString().slice(0,10), expiration:expire||null };
}
async function decryptToken(blob,code){
  const key=await deriveKey(code,b64ToBytes(blob.salt),blob.iterations||ITER);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(blob.iv)},key,b64ToBytes(blob.data));
  return new TextDecoder().decode(plain);
}

/* ---------- GitHub ---------- */
let TOKEN=null, keyBlob=null;
async function gh(path,opt={},token=TOKEN){
  const r=await fetch(API+path,{method:opt.method||'GET',cache:'no-store',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===404 && opt.allow404) return null;
  if(!r.ok){ let m=''; try{ m=(await r.json()).message; }catch(e){}
    const err=new Error(r.status===401?'Clé GitHub refusée (expirée ou supprimée).':r.status===409?'Le fichier a été modifié entre-temps. Rechargez la page puis recommencez.':r.status===403?'Accès refusé par GitHub ('+m+').':`Erreur GitHub ${r.status} ${m}`);
    err.status=r.status; throw err; }
  return r.status===204?null:r.json();
}
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
async function readJSON(path){ const f=await gh(`/contents/${enc(path)}?ref=${BRANCH}`,{allow404:true}); if(!f) return {data:null,sha:null}; return {data:JSON.parse(b64ToUtf8(f.content)),sha:f.sha}; }
async function writeFile(path,b64,message,sha){ const r=await gh(`/contents/${enc(path)}`,{method:'PUT',body:{message,content:b64,branch:BRANCH,...(sha?{sha}:{})}}); return r.content.sha; }
async function writeJSON(path,obj,message,sha){ return writeFile(path,utf8ToB64(JSON.stringify(obj,null,2)+'\n'),message,sha); }
async function deleteFile(path,sha,message){ return gh(`/contents/${enc(path)}`,{method:'DELETE',body:{message,sha,branch:BRANCH}}); }
async function shaOf(path){ const dir=path.split('/').slice(0,-1).join('/'); const list=await gh(`/contents/${enc(dir)}?ref=${BRANCH}`,{allow404:true}); const f=(list||[]).find(x=>x.path===path); return f?f.sha:null; }
async function checkToken(token){
  const r=await fetch(API,{cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
  if(r.status===401) throw new Error('Clé refusée par GitHub : vérifiez qu\'elle est complète et pas expirée.');
  if(r.status===404) throw new Error(`Cette clé n'a pas accès au dépôt ${OWNER}/${REPO}. Vérifiez « Repository access ».`);
  if(!r.ok) throw new Error('Erreur GitHub '+r.status);
  const j=await r.json();
  if(j.permissions && !j.permissions.push) throw new Error('Cette clé peut lire mais pas écrire : mettez « Contents » sur « Read and write ».');
  const h=r.headers.get('github-authentication-token-expiration');
  return { expire: h ? new Date(h.replace(' UTC','Z').replace(' ','T')).toISOString().slice(0,10) : '' };
}

/* ---------- Écran de connexion ---------- */
function daysLeft(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return Math.ceil((new Date(y,m-1,d)-new Date())/864e5); }
function expiryNotice(){
  const n=daysLeft(keyBlob&&keyBlob.expiration); if(n===null||n>30) return '';
  return `<div class="notice"><b>${n<0?'La clé GitHub a expiré':`La clé GitHub expire dans ${n} jour${n>1?'s':''}`}</b> (le ${frDate(keyBlob.expiration)}). Le titulaire du compte GitHub doit en créer une nouvelle : onglet <b>Sécurité → Remplacer la clé GitHub</b>${n<0?', ou <b>Nouvelle configuration</b> ci-dessous':''}.</div>`;
}
function frDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

async function start(){
  try{ const r=await fetch(KEYFILE+'?t='+Date.now(),{cache:'no-store'}); keyBlob = r.ok ? await r.json() : null; }catch(e){ keyBlob=null; }
  if(!keyBlob || !keyBlob.data){ showSetup(true); return; }
  showLogin();
}
function showLogin(msg){
  app.innerHTML=`<div class="lock card top">
    <h3>${ICON.lock.replace('<svg','<svg width="22" height="22"')} Accès admin</h3>
    ${expiryNotice()}
    <label class="field"><span>Code admin</span><input class="in" id="code" type="password" autocomplete="current-password" data-autofocus></label>
    ${msg?`<div class="notice">${esc(msg)}</div>`:''}
    <button class="primary" id="go">Entrer</button>
    <details><summary class="hint" style="cursor:pointer">Code oublié, admin parti, clé expirée ?</summary>
      <p class="hint" style="margin-top:8px">Le titulaire du compte GitHub de l'association peut refaire la configuration : il crée une nouvelle clé GitHub et choisit un nouveau code. L'ancien code ne fonctionnera plus.</p>
      <button class="secondary" id="setup" style="margin-top:8px">Nouvelle configuration</button></details>
  </div>`;
  const code=$('#code'); code.focus();
  const go=async()=>{
    const b=$('#go'); b.disabled=true; b.textContent='Vérification…';
    try{ TOKEN=await decryptToken(keyBlob,code.value); }
    catch(e){ TOKEN=null; showLogin('Code incorrect.'); return; }
    try{ await checkToken(TOKEN); }catch(e){ const t=TOKEN; TOKEN=null; showLogin(e.message); return; }
    openAdmin();
  };
  $('#go').onclick=go; code.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  $('#setup').onclick=()=>showSetup(false);
}

/* ---------- Configuration (première fois ou nouvelle clé) ---------- */
function codeChecks(c1,c2){
  const errs=[];
  if(c1.length<MIN_CODE) errs.push(`Au moins ${MIN_CODE} caractères (une petite phrase de 4 ou 5 mots).`);
  if(c2!==undefined && c1!==c2) errs.push('Les deux codes ne sont pas identiques.');
  return errs;
}
function codeFields(){
  return `<label class="field"><span>Nouveau code admin</span><input class="in" id="c1" type="password" autocomplete="new-password"></label>
    <div class="strength" aria-hidden="true"><i id="bar"></i></div>
    <label class="field"><span>Retaper le code</span><input class="in" id="c2" type="password" autocomplete="new-password"></label>
    <p class="hint">Exemple de bon code : <code>lavande-ferry-calanque-31</code> (ne prenez pas celui-ci). Au moins ${MIN_CODE} caractères.</p>`;
}
function wireStrength(){ const c1=$('#c1'), bar=$('#bar'); c1.addEventListener('input',()=>{ const l=c1.value.length; bar.style.width=Math.min(100,l/24*100)+'%'; bar.style.background=l>=MIN_CODE?'var(--ok)':l>=10?'var(--orange)':'var(--danger)'; }); }

function showSetup(first,replaceOnly){
  // replaceOnly : déjà connecté, on remplace seulement la clé GitHub (le code reste le même si on veut)
  app.innerHTML=`<div class="panel" style="max-width:680px;margin:0 auto">
    <h2 class="sec"><span class="pill">${first?'1re fois':'Clé'}</span>${first?'Première configuration':replaceOnly?'Remplacer la clé GitHub':'Nouvelle configuration'}</h2>
    <div class="notice info">À faire par <b>la personne qui a le compte GitHub de l'association</b> (propriétaire de ${OWNER}), sur un ordinateur. Environ 5 minutes.</div>
    <div class="card top">
      <h3>1. Créer la clé sur GitHub</h3>
      <ol class="steps">
        <li>Connectez-vous à GitHub avec le compte de l'association, puis ouvrez <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>
        <li><b>Token name</b> : <code>DocuBus admin</code>. <b>Resource owner</b> : <code>${OWNER}</code>.</li>
        <li><b>Expiration</b> : <code>No expiration</code> si GitHub le propose, sinon la durée la plus longue. DocuBus préviendra 30 jours avant l'échéance.</li>
        <li><b>Repository access</b> : <code>Only select repositories</code>, puis choisissez <code>${REPO}</code>. Rien d'autre.</li>
        <li><b>Permissions → Repository permissions → Contents</b> : <code>Read and write</code>. Ne touchez à aucune autre permission.</li>
        <li>Cliquez sur <b>Generate token</b> et copiez la clé (elle commence par <code>github_pat_</code>). GitHub ne la montre qu'une fois.</li>
      </ol>
      <label class="field"><span>Coller la clé ici</span><input class="in" id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <div class="row"><button class="secondary" id="chk">Vérifier la clé</button><span id="chkres" class="hint"></span></div>
      <label class="field"><span>Date d'expiration de la clé <small>(vide si aucune)</small></span><input class="in" id="exp" type="date"></label>
    </div>
    <div class="card top">
      <h3>2. ${replaceOnly?'Code admin':'Choisir le code admin'}</h3>
      ${replaceOnly?`<label class="row" style="gap:8px"><input type="checkbox" id="keep" checked> Garder le code actuel</label><div id="newcode" hidden>${codeFields()}</div>`:codeFields()}
    </div>
    <div id="serr"></div>
    <div class="row between">
      <button class="secondary" id="back">${first?'':'← Retour'}</button>
      <button class="primary orange" id="save">Enregistrer</button></div>
  </div>`;
  if(first) $('#back').hidden=true;
  $('#back').onclick=()=> replaceOnly ? openAdmin('secu') : showLogin();
  if(replaceOnly){ $('#keep').onchange=e=>{ $('#newcode').hidden=e.target.checked; }; }
  if($('#c1')) wireStrength();
  let checked=null;
  $('#chk').onclick=async()=>{
    const t=$('#tok').value.trim(), r=$('#chkres'); r.textContent='Vérification…'; r.style.color='';
    try{ const info=await checkToken(t); checked=t; r.textContent='✓ Clé valide, accès en écriture au dépôt.'; r.style.color='var(--ok)'; if(info.expire) $('#exp').value=info.expire; }
    catch(e){ checked=null; r.textContent=e.message; r.style.color='var(--danger)'; }
  };
  $('#save').onclick=async()=>{
    const t=$('#tok').value.trim(), out=$('#serr'); out.innerHTML='';
    const keep = replaceOnly && $('#keep').checked;
    let code=null, errs=[];
    if(!t) errs.push('Collez la clé GitHub.');
    if(!keep){ code=$('#c1').value; errs=errs.concat(codeChecks(code,$('#c2').value)); }
    else{ code=await askCurrentCode(); if(code===null) return; }
    if(errs.length){ out.innerHTML=`<ul class="errors notice" style="margin:0;padding-left:28px">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; return; }
    const b=$('#save'); b.disabled=true; b.textContent='Enregistrement…';
    try{
      if(checked!==t){ const info=await checkToken(t); if(info.expire&&!$('#exp').value) $('#exp').value=info.expire; }
      const blob=await encryptToken(t,code,$('#exp').value||null);
      const sha=await shaOf(KEYFILE).catch(()=>null);
      const prev=TOKEN; TOKEN=t;
      await writeJSON(KEYFILE,blob,first?'Admin : première configuration de l\'accès':'Admin : nouvelle clé d\'accès',sha);
      keyBlob=blob;
      toast('Configuration enregistrée');
      openAdmin(replaceOnly?'secu':'docs');
    }catch(e){ out.innerHTML=`<div class="notice">${esc(e.message)}</div>`; b.disabled=false; b.textContent='Enregistrer'; }
  };
}
function askCurrentCode(){
  return new Promise(res=>{
    openModal(`<h3 id="modal-title">Code actuel</h3><p>Tapez le code admin actuel pour chiffrer la nouvelle clé avec.</p>
      <label class="field"><span>Code actuel</span><input class="in" id="cc" type="password" data-autofocus></label><div id="ccerr"></div>
      <div class="btns"><button class="primary" id="ccok">Valider</button><button class="secondary" id="ccno">Annuler</button></div>`);
    $('#ccno').onclick=()=>{ closeModal(); res(null); };
    $('#ccok').onclick=async()=>{ const v=$('#cc').value; try{ await decryptToken(keyBlob,v); closeModal(); res(v); }catch(e){ $('#ccerr').innerHTML='<div class="notice">Code incorrect.</div>'; } };
  });
}

/* ======================================================================
   ADMIN CONNECTÉ
   ====================================================================== */
let tab='docs', cat=null, catSha=null, lists=null, listsSha=null, struct=null, structSha=null, listsDirty=false;
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'document'; }
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const sizeTxt=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko';

async function openAdmin(t){
  if(t) tab=t;
  app.innerHTML='<p class="hint">Chargement des données…</p>';
  try{
    const [a,b,c]=await Promise.all([readJSON(DOCS),readJSON(LISTS),readJSON(STRUCT)]);
    cat=a.data||{categories:[],documents:[]}; catSha=a.sha; cat.categories=cat.categories||[]; cat.documents=cat.documents||[];
    lists=Array.isArray(b.data)?b.data:[]; listsSha=b.sha; listsDirty=false;
    struct=c.data||{}; structSha=c.sha;
  }catch(e){ app.innerHTML=`<div class="notice">${esc(e.message)}</div><button class="secondary" onclick="location.reload()">Recharger</button>`; return; }
  renderAdmin();
}
window.addEventListener('beforeunload',e=>{ if(listsDirty){ e.preventDefault(); e.returnValue=''; } });

function renderAdmin(){
  app.innerHTML=`<div class="panel">
    <div class="adm-top"><span class="notice ok" style="padding:6px 10px">● Connecté</span>
      <button class="secondary" id="logout">${ICON.lock}Se déconnecter</button></div>
    ${expiryNotice()}
    <div class="tabs" role="tablist">
      <button role="tab" data-t="docs" aria-selected="${tab==='docs'}">Documents</button>
      <button role="tab" data-t="lists" aria-selected="${tab==='lists'}">Listes de diffusion</button>
      <button role="tab" data-t="secu" aria-selected="${tab==='secu'}">Sécurité</button>
    </div>
    <div id="pane"></div></div>`;
  $('#logout').onclick=()=>{ if(listsDirty&&!confirm('Des modifications des listes ne sont pas enregistrées. Se déconnecter quand même ?')) return; TOKEN=null; listsDirty=false; showLogin(); toast('Déconnecté'); };
  app.querySelector('.tabs').onclick=e=>{ const b=e.target.closest('[data-t]'); if(!b) return;
    if(listsDirty && tab==='lists' && b.dataset.t!=='lists' && !confirm('Les listes modifiées ne sont pas enregistrées. Quitter quand même ?')) return;
    if(tab==='lists' && b.dataset.t!=='lists'){ listsDirty=false; openAdmin(b.dataset.t); return; }
    tab=b.dataset.t; renderAdmin(); };
  ({docs:renderDocs,lists:renderLists,secu:renderSecu})[tab]();
}
const deployNote='<p class="hint">Les changements apparaissent dans l\'appli d\'ici 1 à 2 minutes (le temps que GitHub mette le site à jour).</p>';

/* ---------- Documents ---------- */
let queue=[];
async function saveCatalog(msg){ catSha=await writeJSON(DOCS,cat,msg,catSha); }
function renderDocs(){
  const pane=$('#pane');
  const catOpts=sel=>cat.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.nom)}</option>`).join('');
  const qrows=queue.map((q,i)=>`<div class="prow" data-q="${i}">
      <label class="field"><input class="in" data-qk="titre" value="${esc(q.titre)}" aria-label="Titre du document"><small>${esc(q.file.name)} · ${sizeTxt(q.file.size)}</small></label>
      <select class="in" data-qk="categorie" aria-label="Catégorie">${catOpts(q.categorie)}</select>
      <button class="mini red" data-qdel="${i}" aria-label="Retirer">${ICON.trash}</button></div>`).join('');
  const cats=cat.categories.map((c,ci)=>{
    const docs=cat.documents.filter(d=>d.categorie===c.id).sort((a,b)=>a.titre.localeCompare(b.titre,'fr'));
    return `<div class="card" data-cat="${esc(c.id)}">
      <div class="cathead"><h3>${esc(c.nom)} <span class="hint">(${docs.length})</span></h3>
        <button class="mini" data-cact="up" ${ci===0?'disabled':''} aria-label="Monter">${ICON.upA}</button>
        <button class="mini" data-cact="down" ${ci===cat.categories.length-1?'disabled':''} aria-label="Descendre">${ICON.downA}</button>
        <button class="mini" data-cact="rename">Renommer</button>
        <button class="mini red" data-cact="del">${ICON.trash}Supprimer</button></div>
      ${docs.length?`<table class="dtable"><tbody>${docs.map(d=>`<tr data-doc="${esc(d.id)}">
        <td class="t"><a href="${esc(d.fichier)}?v=${esc(d.v||'')}" target="_blank" rel="noopener">${esc(d.titre)}</a><small>${esc(d.fichier.split('/').pop())} · mis à jour le ${frDate(d.maj)}${d.taille?' · '+sizeTxt(d.taille):''}</small></td>
        <td class="a"><button class="mini" data-dact="version">${ICON.up}Nouvelle version</button>
          <button class="mini" data-dact="rename">Renommer</button>
          <select class="mini" data-dact="move" aria-label="Déplacer vers">${cat.categories.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${x.id===c.id?'Déplacer…':esc(x.nom)}</option>`).join('')}</select>
          <button class="mini red" data-dact="del" aria-label="Supprimer">${ICON.trash}</button></td></tr>`).join('')}</tbody></table>`
        :`<p class="hint">Aucun document.</p>`}
    </div>`;}).join('');
  pane.innerHTML=`<div class="panel">
    <div class="card top" style="--g:var(--orange)">
      <h3>Ajouter des documents</h3>
      <label class="drop" id="drop">${ICON.up}<b>Glissez des fichiers ici</b><span class="hint">ou cliquez pour les choisir · PDF, Word, Excel, images · ${MAX_MB} Mo max</span>
        <input type="file" id="pick" multiple accept=".pdf,.doc,.docx,.odt,.rtf,.xls,.xlsx,.ods,.csv,.jpg,.jpeg,.png" hidden></label>
      ${queue.length?`<div class="pending">${qrows}</div>
        <div class="row end"><button class="secondary" id="qclear">Vider</button><button class="primary orange" id="qsend">${ICON.up}Déposer ${queue.length} fichier${queue.length>1?'s':''}</button></div>`:''}
      <div id="ulog"></div>
      ${deployNote}
    </div>
    <div class="row between"><h2 class="sec" style="font-size:19px">Catégories</h2><button class="secondary" id="addcat">${ICON.plus}Nouvelle catégorie</button></div>
    ${cats||'<p class="hint">Aucune catégorie.</p>'}
    <p class="hint">Les fichiers ne contiennent aucune donnée patient : ce sont des documents vierges, visibles par toute personne qui a l'adresse de l'appli.</p>
  </div>`;
  const drop=$('#drop'), pick=$('#pick');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  pick.addEventListener('change',()=>{ addFiles(pick.files); pick.value=''; });
  pane.oninput=e=>{ const r=e.target.closest('[data-q]'); if(r&&e.target.dataset.qk) queue[+r.dataset.q][e.target.dataset.qk]=e.target.value; };
  pane.onchange=e=>{ const r=e.target.closest('[data-q]'); if(r&&e.target.dataset.qk) queue[+r.dataset.q][e.target.dataset.qk]=e.target.value;
    if(e.target.dataset.dact==='move') moveDoc(e.target.closest('[data-doc]').dataset.doc,e.target.value); };
  pane.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.qdel!==undefined){ queue.splice(+b.dataset.qdel,1); renderDocs(); }
    if(b.id==='qclear'){ queue=[]; renderDocs(); }
    if(b.id==='qsend') uploadQueue();
    if(b.id==='addcat') promptBox('Nouvelle catégorie','Nom de la catégorie','',addCat);
    if(b.dataset.cact) catAction(b.closest('[data-cat]').dataset.cat,b.dataset.cact);
    if(b.dataset.dact) docAction(b.closest('[data-doc]').dataset.doc,b.dataset.dact);
  };
}
function cleanTitle(name){ const t=name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim(); return t.charAt(0).toUpperCase()+t.slice(1); }
function addFiles(list){
  const def=cat.categories[0]&&cat.categories[0].id;
  [...list].forEach(f=>{
    if(f.size>MAX_MB*1048576){ toast(`${f.name} : trop gros (${MAX_MB} Mo max).`); return; }
    queue.push({file:f,titre:cleanTitle(f.name),categorie:(queue[queue.length-1]||{}).categorie||def});
  });
  renderDocs();
}
function log(html,cls){ const l=$('#ulog'); if(!l) return; if(!l.firstChild) l.className='log'; l.insertAdjacentHTML('beforeend',`<div class="${cls||''}">${html}</div>`); l.scrollTop=l.scrollHeight; }
function uniquePath(c,titre,ext){
  let base=`documents/${c}/${slug(titre)}`, p=`${base}.${ext}`, i=2;
  while(cat.documents.some(d=>d.fichier===p)) p=`${base}-${i++}.${ext}`;
  return p;
}
async function uploadQueue(){
  if(!queue.length) return;
  if(queue.some(q=>!q.titre.trim())){ toast('Chaque document doit avoir un titre.'); return; }
  const btns=$('#pane').querySelectorAll('button'); btns.forEach(b=>b.disabled=true);
  let done=0;
  for(const q of queue.slice()){
    const ext=(q.file.name.split('.').pop()||'pdf').toLowerCase();
    const path=uniquePath(q.categorie,q.titre,ext);
    try{
      log(`Envoi de « ${esc(q.titre)} »…`);
      await writeFile(path,await fileToB64(q.file),`Document ajouté : ${q.titre}`);
      cat.documents.push({id:slug(q.titre)+'-'+Date.now().toString(36),titre:q.titre.trim(),categorie:q.categorie,fichier:path,maj:today(),v:Date.now().toString(36),taille:q.file.size});
      queue.splice(queue.indexOf(q),1); done++;
      log('✓ fichier déposé','ok');
    }catch(e){ log('✗ '+esc(e.message),'ko'); }
  }
  if(done){ try{ await saveCatalog(`Liste des documents : ${done} ajout${done>1?'s':''}`); log(`✓ ${done} document${done>1?'s':''} ajouté${done>1?'s':''} à la liste`,'ok'); toast('Documents déposés'); }
    catch(e){ log('✗ Liste non mise à jour : '+esc(e.message),'ko'); } }
  const l=$('#ulog').innerHTML; renderDocs(); $('#ulog').className='log'; $('#ulog').innerHTML=l;
}
function addCat(nom){
  let id=slug(nom), i=2; while(cat.categories.some(c=>c.id===id)) id=slug(nom)+'-'+i++;
  cat.categories.push({id,nom}); persistCat(`Catégorie ajoutée : ${nom}`);
}
async function persistCat(msg){
  try{ await saveCatalog(msg); toast('Enregistré'); }catch(e){ toast(e.message); await openAdmin('docs'); return; }
  renderDocs();
}
function catAction(id,act){
  const i=cat.categories.findIndex(c=>c.id===id), c=cat.categories[i];
  if(act==='up'||act==='down'){ const j=act==='up'?i-1:i+1; [cat.categories[i],cat.categories[j]]=[cat.categories[j],cat.categories[i]]; persistCat('Ordre des catégories'); }
  if(act==='rename') promptBox('Renommer la catégorie','Nouveau nom',c.nom,v=>{ c.nom=v; persistCat(`Catégorie renommée : ${v}`); });
  if(act==='del'){
    if(cat.documents.some(d=>d.categorie===id)){ openModal(`<h3 id="modal-title">Catégorie non vide</h3><p>Déplacez ou supprimez d'abord ses documents.</p><button class="secondary" data-close>OK</button>`); return; }
    if(id==='delivrance-exceptionnelle'){ toast('Cette catégorie contient le lien vers le formulaire de délivrance : elle ne peut pas être supprimée.'); return; }
    confirmBox('Supprimer la catégorie ?',`« ${esc(c.nom)} » disparaîtra de l'appli.`,'Supprimer',()=>{ cat.categories.splice(i,1); persistCat(`Catégorie supprimée : ${c.nom}`); });
  }
}
function docAction(id,act){
  const d=cat.documents.find(x=>x.id===id); if(!d) return;
  if(act==='rename') promptBox('Renommer le document','Titre affiché dans l\'appli',d.titre,v=>{ d.titre=v; persistCat(`Document renommé : ${v}`); });
  if(act==='del') confirmBox('Supprimer ce document ?',`« ${esc(d.titre)} » sera retiré de l'appli. L'ancienne version reste récupérable dans l'historique GitHub.`,'Supprimer',async()=>{
    try{ const sha=await shaOf(d.fichier); if(sha) await deleteFile(d.fichier,sha,`Document supprimé : ${d.titre}`);
      cat.documents=cat.documents.filter(x=>x!==d); await persistCat(`Liste des documents : suppression de ${d.titre}`); }
    catch(e){ toast(e.message); } });
  if(act==='version'){
    const inp=document.createElement('input'); inp.type='file';
    const ext=d.fichier.split('.').pop(); inp.accept='.'+ext;
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      if(f.size>MAX_MB*1048576){ toast(`Fichier trop gros (${MAX_MB} Mo max).`); return; }
      if(f.name.split('.').pop().toLowerCase()!==ext.toLowerCase()){ toast(`Choisissez un fichier .${ext}, comme l'original.`); return; }
      toast('Envoi de la nouvelle version…');
      try{ const sha=await shaOf(d.fichier); await writeFile(d.fichier,await fileToB64(f),`Nouvelle version : ${d.titre}`,sha);
        d.maj=today(); d.v=Date.now().toString(36); d.taille=f.size; await persistCat(`Liste des documents : nouvelle version de ${d.titre}`); toast('Nouvelle version déposée'); }
      catch(e){ toast(e.message); }
    };
    inp.click();
  }
}
function moveDoc(id,to){ const d=cat.documents.find(x=>x.id===id); if(!d||d.categorie===to) return; d.categorie=to; persistCat(`Document déplacé : ${d.titre}`); }

/* ---------- Listes de diffusion ---------- */
const MAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function renderLists(){
  const pane=$('#pane');
  pane.innerHTML=`<div class="panel">
    <p class="hint">Chaque destinataire apparaît dans la liste « CSAPA de suivi » du formulaire de délivrance. Le <b>nom affiché sur le PDF</b> est celui imprimé après « À l'attention de ».</p>
    <div class="dest">${lists.map((l,i)=>`<div class="card top" data-l="${i}" style="--g:var(--blue)">
      <div class="cathead"><h3>${esc(l.nom||'Nouveau destinataire')}</h3>
        <button class="mini" data-lact="up" ${i===0?'disabled':''} aria-label="Monter">${ICON.upA}</button>
        <button class="mini" data-lact="down" ${i===lists.length-1?'disabled':''} aria-label="Descendre">${ICON.downA}</button>
        <button class="mini red" data-lact="del">${ICON.trash}Supprimer</button></div>
      <div class="grid2">
        <label class="field"><span>Nom dans la liste</span><input class="in" data-lk="nom" value="${esc(l.nom)}" placeholder="ex. Puget"></label>
        <label class="field"><span>Nom imprimé sur le PDF</span><input class="in" data-lk="structure" value="${esc(l.structure)}" placeholder="ex. CSAPA Puget Corderie"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>À l'attention de <small>(facultatif, prérempli)</small></span><input class="in" data-lk="attention" value="${esc(l.attention)}" placeholder="ex. Dr …"></label>
        <label class="field"><span>Adresses mail <small>(une par ligne)</small></span><textarea class="in" data-lk="adresses" rows="2" spellcheck="false">${esc((l.adresses||[]).join('\n'))}</textarea></label>
      </div></div>`).join('')}</div>
    <div class="row between"><button class="secondary" id="addl">${ICON.plus}Ajouter un destinataire</button>
      <span class="row"><span class="dirty" id="dirty" ${listsDirty?'':'hidden'}>Modifications non enregistrées</span>
      <button class="primary orange" id="savel">Enregistrer les listes</button></span></div>
    <div id="lerr"></div>
    ${deployNote}

    <details class="card"><summary style="cursor:pointer;font-weight:700;color:var(--navy)">Textes imprimés sur les attestations (signataire, en-tête, pied de page)</summary>
      <div style="display:grid;gap:10px;margin-top:12px">
        <div class="grid2"><label class="field"><span>Signataire</span><input class="in" data-sk="signataire" value="${esc(struct.signataire)}"></label>
          <label class="field"><span>Ville</span><input class="in" data-sk="ville" value="${esc(struct.ville)}"></label></div>
        <label class="field"><span>Nom court (objet du mail)</span><input class="in" data-sk="nom" value="${esc(struct.nom)}"></label>
        <label class="field"><span>En-tête sous le logo <small>(une ligne par ligne)</small></span><textarea class="in" data-sk="entete" rows="3">${esc((struct.entete||[]).join('\n'))}</textarea></label>
        <label class="field"><span>Pied de page <small>(une ligne par ligne)</small></span><textarea class="in" data-sk="pied" rows="4">${esc((struct.pied||[]).join('\n'))}</textarea></label>
        <div class="row end"><button class="primary" id="saves">Enregistrer les textes</button></div>
      </div></details>
  </div>`;
  const mark=()=>{ listsDirty=true; $('#dirty').hidden=false; };
  pane.oninput=e=>{
    const c=e.target.closest('[data-l]');
    if(c&&e.target.dataset.lk){ const l=lists[+c.dataset.l], k=e.target.dataset.lk;
      l[k]= k==='adresses' ? e.target.value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean) : e.target.value;
      if(k==='nom') c.querySelector('h3').textContent=e.target.value||'Nouveau destinataire';
      mark(); }
  };
  pane.onchange=null;
  pane.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    const c=b.closest('[data-l]'), i=c?+c.dataset.l:-1;
    if(b.dataset.lact==='up'||b.dataset.lact==='down'){ const j=b.dataset.lact==='up'?i-1:i+1; [lists[i],lists[j]]=[lists[j],lists[i]]; listsDirty=true; renderLists(); }
    if(b.dataset.lact==='del') confirmBox('Supprimer ce destinataire ?',`« ${esc(lists[i].nom)} » disparaîtra de la liste après enregistrement.`,'Supprimer',()=>{ lists.splice(i,1); listsDirty=true; renderLists(); });
    if(b.id==='addl'){ lists.push({nom:'',structure:'',attention:'',adresses:[]}); listsDirty=true; renderLists(); const last=pane.querySelectorAll('[data-l]'); last[last.length-1].querySelector('input').focus(); }
    if(b.id==='savel') saveLists();
    if(b.id==='saves') saveStruct();
  };
}
async function saveLists(){
  const errs=[];
  lists.forEach((l,i)=>{ const n=l.nom||`n° ${i+1}`;
    if(!l.nom.trim()) errs.push(`Destinataire ${i+1} : nom manquant.`);
    if(!(l.structure||'').trim()) errs.push(`${n} : nom imprimé sur le PDF manquant.`);
    if(!(l.adresses||[]).length) errs.push(`${n} : aucune adresse mail.`);
    (l.adresses||[]).forEach(a=>{ if(!MAIL.test(a)) errs.push(`${n} : adresse incorrecte « ${a} ».`); }); });
  const out=$('#lerr');
  if(errs.length){ out.innerHTML=`<ul class="notice" style="margin:0;padding-left:28px">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; return; }
  out.innerHTML='';
  const clean=lists.map(l=>({nom:l.nom.trim(),structure:l.structure.trim(),attention:(l.attention||'').trim(),adresses:l.adresses}));
  try{ listsSha=await writeJSON(LISTS,clean,'Listes de diffusion mises à jour',listsSha); lists=clean; listsDirty=false; renderLists(); toast('Listes enregistrées'); }
  catch(e){ out.innerHTML=`<div class="notice">${esc(e.message)}</div>`; }
}
async function saveStruct(){
  const v=k=>$(`[data-sk="${k}"]`).value;
  const lines=k=>v(k).split('\n').map(x=>x.trim()).filter(Boolean);
  const s={...struct,nom:v('nom').trim(),signataire:v('signataire').trim(),ville:v('ville').trim(),entete:lines('entete'),pied:lines('pied')};
  if(!s.signataire){ toast('Le signataire est obligatoire.'); return; }
  try{ structSha=await writeJSON(STRUCT,s,'Textes des attestations mis à jour',structSha); struct=s; toast('Textes enregistrés'); }
  catch(e){ toast(e.message); }
}

/* ---------- Sécurité ---------- */
function renderSecu(){
  const n=daysLeft(keyBlob.expiration);
  $('#pane').innerHTML=`<div class="panel" style="max-width:680px">
    <div class="card top">
      <h3>Clé GitHub</h3>
      <p class="hint">${keyBlob.expiration?`Expire le <b>${frDate(keyBlob.expiration)}</b>${n!==null?` (dans ${n} jour${Math.abs(n)>1?'s':''})`:''}.`:'Pas de date d\'expiration enregistrée.'} Code modifié le ${frDate(keyBlob.modifie)}.</p>
      <button class="secondary" id="replace">Remplacer la clé GitHub</button>
      <p class="hint">À faire à l'expiration, ou si un ancien admin pourrait encore avoir le code. Réservé au titulaire du compte GitHub. Pensez ensuite à supprimer l'ancienne clé sur <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">github.com/settings/personal-access-tokens</a>.</p>
    </div>
    <div class="card top" style="--g:var(--orange)">
      <h3>Changer le code admin</h3>
      <p class="hint">À faire à chaque départ d'un admin. Le nouveau code remplace l'ancien immédiatement.</p>
      ${codeFields()}
      <div id="cerr"></div>
      <div class="row end"><button class="primary orange" id="chcode">Changer le code</button></div>
    </div>
  </div>`;
  wireStrength();
  $('#replace').onclick=()=>showSetup(false,true);
  $('#chcode').onclick=async()=>{
    const c1=$('#c1').value, errs=codeChecks(c1,$('#c2').value), out=$('#cerr');
    if(errs.length){ out.innerHTML=`<div class="notice">${errs.map(esc).join('<br>')}</div>`; return; }
    try{ const blob=await encryptToken(TOKEN,c1,keyBlob.expiration); const sha=await shaOf(KEYFILE); await writeJSON(KEYFILE,blob,'Admin : changement du code',sha); keyBlob=blob;
      toast('Code changé'); renderSecu(); }
    catch(e){ out.innerHTML=`<div class="notice">${esc(e.message)}</div>`; }
  };
}

if(!window.crypto||!crypto.subtle){ app.innerHTML='<div class="notice">Ce navigateur est trop ancien pour la page admin. Utilisez Chrome, Edge, Firefox ou Safari à jour.</div>'; }
else start();
})();
</script>
</body>
