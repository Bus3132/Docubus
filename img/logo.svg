      <path d="M384 76h40M384 92h40M384 108h26" stroke="#77787b" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="rotate(14 462 168)"><rect x="436" y="136" width="50" height="62" rx="5" fill="#fff"/>
      <path d="M446 154h30M446 168h30M446 182h18" stroke="#ee8a12" stroke-width="5" stroke-linecap="round"/></g>
  </g>

